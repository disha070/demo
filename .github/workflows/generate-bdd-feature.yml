name: Generate BDD feature from issue

on:
  issues:
    types: [ opened ]

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-feature:
    if: >-
      startsWith(github.event.issue.title, '[BDD]') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test feature generator
        run: python -m unittest discover -s tests -p 'test_feature_generator.py'

      - name: Generate feature file
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python scripts/generate_bdd_feature.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lint generated feature
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: npx --yes gherkin-lint --config .github/workflows/.gherkin-lintrc "features/issue-${ISSUE_NUMBER}.feature"

      - name: Open feature pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.BDD_PR_TOKEN || github.token }}
          add-paths: features/issue-*.feature
          branch: bdd/issue-${{ github.event.issue.number }}
          delete-branch: true
          draft: true
          title: "BDD feature for issue #${{ github.event.issue.number }}"
          body: "Generated from issue #${{ github.event.issue.number }}. Review the feature and add implementation/tests as needed."
          commit-message: "test: add BDD feature for issue #${{ github.event.issue.number }}"