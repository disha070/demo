name: BDD Automation & Cucumber Annotations

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  issues:
    types: [ opened, labeled ]

jobs:
  build-and-annotate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python for BDD processing
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step 1: Install required dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-bdd playwright pytest-cucumber-json
          playwright install --with-deps chromium

      # Step 2: Run BDD tests and generate the report file
      - name: Run BDD tests
        run: |
          pytest --cucumber-json=cucumber-report.json
        continue-on-error: true # Allows workflow to proceed so annotations can be published on failure

      # Step 3: Cucumber Report to Annotations Action
      - name: Cucumber Report to Annotations
        uses: deblockt/cucumber-report-annotations-action@v1.16
        if: always()
        with:
          access-token: ${{ secrets.GITHUB_TOKEN }}
          path: '**/cucumber-report.json'
          check-status-on-error: 'failure'
          check-status-on-undefined: 'success'
          check-status-on-pending: 'success'
          annotation-status-on-error: 'failure'
          show-number-of-error-on-check-title: true
          show-global-summary-report: true
          number-of-test-error-to-fail-job: -1
          name: 'Cucumber report'
