name: BDD Feature File Validation

on:
  pull_request:
    branches: [ main, master ]
    paths:
      - '**/*.feature'

jobs:
  validate-gherkin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lint Feature Files
        run: npx --yes gherkin-lint --config .github/workflows/.gherkin-lintrc